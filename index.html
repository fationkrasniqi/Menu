<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A premium responsive restaurant menu with live search and category filters."
    />
    <title>EM lounge bar</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="loading-screen" id="loadingScreen" aria-hidden="true">
      <div class="loader">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <main id="top">
      <section class="menu-toolbar" aria-label="Menu controls">
        <div class="toolbar-inner">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="sr-only" for="menuSearch">Search menu items</label>
            <input
              id="menuSearch"
              type="search"
              placeholder="Kerko burgera, pasta, pizza..."
              autocomplete="off"
            />
          </div>

          <div
            class="category-filters"
            id="categoryFilters"
            aria-label="Filter menu by category"
          ></div>
        </div>
      </section>

      <section class="menu-section" aria-labelledby="menuTitle">
        <div class="section-heading">
          <img
            class="menu-heading-logo"
            src="images/logo.webp"
            alt="EM Logo"
            width="110"
            height="110"
          />
          <h2 id="menuTitle">EM Menu</h2>
          <p id="resultCount" class="result-count" aria-live="polite"></p>
        </div>

        <div class="menu-grid" id="menuGrid" aria-live="polite"></div>

        <!-- <div class="empty-state" id="emptyState" hidden>
          <span aria-hidden="true">⌕</span>
          <h3>No dishes found</h3>
          <p>Try another search term or choose a different category.</p>
        </div> -->
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
